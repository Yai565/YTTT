<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Mario - Hiro Marker Game</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background:#000; }
    #ar-container { position: fixed; inset: 0; }
    .hud {
      position: fixed; z-index: 20; top: 12px; left: 50%; transform: translateX(-50%);
      min-width: 250px; padding: 10px 18px; border-radius: 18px;
      background: rgba(0,0,0,.68); color:#fff; text-align:center;
      border: 2px solid rgba(255,255,255,.25); backdrop-filter: blur(5px);
    }
    #score { font-size: 26px; font-weight: 800; }
    #status { font-size: 13px; margin-top: 2px; opacity: .9; }
    .controls {
      position: fixed; z-index: 30; left: 0; right: 0; bottom: 18px;
      display:flex; justify-content:center; gap:12px; padding:0 12px;
    }
    button {
      border: 0; border-radius: 16px; padding: 14px 20px; min-width: 135px;
      font-size: 17px; font-weight: 800; color:#fff; cursor:pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,.35);
      -webkit-tap-highlight-color: transparent;
    }
    #jumpBtn { background:#1677ff; }
    #finishBtn { background:#e53935; }
    button:active { transform: scale(.96); }
    #message {
      position:fixed; z-index:40; left:50%; top:50%; transform:translate(-50%,-50%);
      display:none; text-align:center; color:#fff; background:rgba(0,0,0,.8);
      padding:24px 28px; border-radius:22px; border:2px solid #ffd54a;
      min-width:280px; font-weight:800;
    }
    #message .big { font-size:38px; margin-bottom:8px; }
    #message .small { font-size:16px; line-height:1.5; }
    .hint {
      position:fixed; z-index:20; left:50%; bottom:92px; transform:translateX(-50%);
      color:#fff; background:rgba(0,0,0,.52); padding:8px 13px; border-radius:12px;
      font-size:12px; text-align:center; pointer-events:none;
    }
  </style>

  <!-- A-Frame + AR.js marker tracking -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body>
  <div id="ar-container">
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="antialias: true; colorManagement: true"
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      device-orientation-permission-ui="enabled: true">

      <a-assets>
        <img id="marioTexture" src="mario.png" crossorigin="anonymous">
      </a-assets>

      <!-- Hiro marker: point the camera at a standard AR.js HIRO marker -->
      <a-marker id="hiroMarker" preset="hiro"
                smooth="true" smoothCount="5" smoothTolerance=".01" smoothThreshold="5">

        <!-- Mario image as a front-facing plane -->
        <a-plane id="mario"
                 src="#marioTexture"
                 position="0 0.95 0"
                 rotation="-90 0 0"
                 width="1.35" height="1.9"
                 material="transparent: true; alphaTest: 0.05; side: double"
                 animation__idle="property: position; from: 0 0.95 0; to: 0 1.02 0; dir: alternate; dur: 900; loop: true; easing: easeInOutSine">
        </a-plane>

        <!-- Gold coin: starts above Mario -->
        <a-cylinder id="coin"
                     position="0 2.35 0"
                     radius=".22" height=".08"
                     rotation="90 0 0"
                     color="#FFD700"
                     material="metalness: .75; roughness: .2"
                     visible="true"
                     animation__spin="property: rotation; to: 90 360 0; loop: true; dur: 900; easing: linear"
                     animation__float="property: position; from: 0 2.25 0; to: 0 2.42 0; dir: alternate; loop: true; dur: 650; easing: easeInOutSine">
          <a-text value="10" align="center" color="#7a4b00" width="1.4" position="0 0.045 0.05" rotation="-90 0 0"></a-text>
        </a-cylinder>

        <!-- Small coin glow -->
        <a-ring id="coinGlow" position="0 2.35 0" rotation="-90 0 0"
                radius-inner=".25" radius-outer=".32"
                color="#FFF59D" opacity=".7"
                animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dir: alternate; loop:true; dur:500">
        </a-ring>

        <!-- Celebration fireworks -->
        <a-entity id="fireworks" visible="false"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </div>

  <div class="hud">
    <div id="score">คะแนน: 0</div>
    <div id="status">กำลังรอ Marker HIRO...</div>
  </div>

  <div class="hint">ส่องกล้องไปที่ Marker HIRO แล้วกด “กระโดดโหม่งเหรียญ”</div>

  <div class="controls">
    <button id="jumpBtn">🆙 กระโดดโหม่งเหรียญ +10</button>
    <button id="finishBtn">🏁 จบเกม</button>
  </div>

  <div id="message">
    <div class="big">🎉 จบเกม! 🎉</div>
    <div class="small" id="finalScore"></div>
  </div>

<script>
(() => {
  const marker = document.getElementById('hiroMarker');
  const mario = document.getElementById('mario');
  const coin = document.getElementById('coin');
  const coinGlow = document.getElementById('coinGlow');
  const fireworks = document.getElementById('fireworks');
  const scoreEl = document.getElementById('score');
  const statusEl = document.getElementById('status');
  const jumpBtn = document.getElementById('jumpBtn');
  const finishBtn = document.getElementById('finishBtn');
  const message = document.getElementById('message');
  const finalScore = document.getElementById('finalScore');

  let score = 0;
  let jumping = false;
  let finished = false;

  marker.addEventListener('markerFound', () => {
    if (!finished) statusEl.textContent = 'พบ Marker HIRO แล้ว! พร้อมเล่น 🎮';
  });

  marker.addEventListener('markerLost', () => {
    if (!finished) statusEl.textContent = 'ไม่พบ Marker HIRO — หันกล้องกลับไปที่ Marker';
  });

  function updateScore() {
    scoreEl.textContent = `คะแนน: ${score}`;
  }

  function resetCoin() {
    coin.setAttribute('visible', 'true');
    coinGlow.setAttribute('visible', 'true');
    coin.setAttribute('position', '0 2.35 0');
    coinGlow.setAttribute('position', '0 2.35 0');
  }

  function jump() {
    if (finished || jumping) return;
    if (!marker.object3D.visible) {
      statusEl.textContent = 'กรุณาส่องกล้องให้พบ Marker HIRO ก่อน';
      return;
    }

    jumping = true;
    statusEl.textContent = 'Mario กระโดด! 💥';

    // Animate Mario upward and slightly forward.
    mario.removeAttribute('animation__jump');
    mario.setAttribute('animation__jump',
      'property: position; from: 0 0.95 0; to: 0 2.15 0; dur: 380; easing: easeOutQuad; dir: alternate; loop: 2');

    // Move coin downward into Mario's jump path.
    coin.removeAttribute('animation__hit');
    coin.setAttribute('animation__hit',
      'property: position; from: 0 2.35 0; to: 0 1.95 0; dur: 380; easing: easeInQuad');

    coinGlow.removeAttribute('animation__hit');
    coinGlow.setAttribute('animation__hit',
      'property: position; from: 0 2.35 0; to: 0 1.95 0; dur: 380; easing: easeInQuad');

    setTimeout(() => {
      score += 10;
      updateScore();
      statusEl.textContent = '+10 คะแนน! 🪙';
      coin.setAttribute('visible', 'false');
      coinGlow.setAttribute('visible', 'false');
    }, 410);

    setTimeout(() => {
      mario.removeAttribute('animation__jump');
      mario.setAttribute('position', '0 0.95 0');
      resetCoin();
      jumping = false;
      if (!finished) statusEl.textContent = 'พร้อมกระโดดครั้งต่อไป!';
    }, 1150);
  }

  function makeFirework(x, y, z, delay) {
    const ring = document.createElement('a-ring');
    ring.setAttribute('position', `${x} ${y} ${z}`);
    ring.setAttribute('rotation', '-90 0 0');
    ring.setAttribute('radius-inner', '.05');
    ring.setAttribute('radius-outer', '.28');
    ring.setAttribute('color', '#FFD700');
    ring.setAttribute('opacity', '.95');
    ring.setAttribute('material', 'shader: flat; side: double');
    ring.setAttribute('animation__scale',
      `property: scale; from: .2 .2 .2; to: 2.8 2.8 2.8; dur: 650; delay:${delay}; easing:easeOutQuad`);
    ring.setAttribute('animation__fade',
      `property: material.opacity; from: .95; to: 0; dur:650; delay:${delay}; easing:easeInQuad`);
    fireworks.appendChild(ring);

    // Firework rays
    for (let i = 0; i < 12; i++) {
      const ray = document.createElement('a-box');
      const a = i * Math.PI * 2 / 12;
      const r = .75;
      ray.setAttribute('position', `${x + Math.cos(a)*r} ${y + Math.sin(a)*r} ${z}`);
      ray.setAttribute('scale', '.05 .25 .05');
      ray.setAttribute('color', i % 2 ? '#FFEB3B' : '#FF5722');
      ray.setAttribute('rotation', `0 0 ${i*30}`);
      ray.setAttribute('material', 'shader: flat');
      ray.setAttribute('animation',
        `property: scale; from: .05 .1 .05; to: .05 .6 .05; dur:650; delay:${delay}; easing:easeOutQuad`);
      fireworks.appendChild(ray);
    }
  }

  function finishGame() {
    if (finished) return;
    finished = true;
    message.style.display = 'block';
    finalScore.textContent = `คะแนนรวม: ${score} คะแนน`;

    statusEl.textContent = 'จบเกม 🎆 ขอบคุณที่เล่น!';
    fireworks.setAttribute('visible', 'true');

    // Multiple celebration bursts.
    makeFirework(-1.0, 2.4, 0, 0);
    makeFirework(1.0, 2.8, 0, 180);
    makeFirework(0, 3.2, 0, 360);
    makeFirework(-.55, 1.9, 0, 520);
    makeFirework(.65, 2.0, 0, 680);
  }

  jumpBtn.addEventListener('click', jump);
  finishBtn.addEventListener('click', finishGame);

  // Keyboard support for desktop testing.
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); jump(); }
    if (e.code === 'Enter') finishGame();
  });
})();
</script>
</body>
</html>
